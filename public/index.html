<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mint Tracker</title>
<style>
  :root { color-scheme: light dark; --bg:#0b0d10; --fg:#e6e9ef; --dim:#8b93a7;
          --line:#232833; --hot:#ff8a3d; --free:#3ddc97; --err:#ff6b6b; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#ffffff; --fg:#14171f; --dim:#5d6577; --line:#e3e6ec; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; padding:24px; }
  header { margin-bottom:20px; }
  h1 { font-size:16px; margin:0 0 4px; letter-spacing:.02em; }
  .sub { color:var(--dim); font-size:12px; }
  .controls { margin:16px 0; display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  label { color:var(--dim); font-size:12px; display:flex; gap:6px; align-items:center; }
  .wrap { overflow-x:auto; border:1px solid var(--line); border-radius:6px; }
  table { border-collapse:collapse; width:100%; min-width:760px; }
  th,td { text-align:right; padding:8px 12px; border-bottom:1px solid var(--line);
          white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; }
  tbody tr:last-child td { border-bottom:none; }
  th { color:var(--dim); font-weight:500; font-size:11px; text-transform:uppercase;
       letter-spacing:.05em; }
  tr.hot td { color:var(--hot); font-weight:600; }
  .free { color:var(--free); }
  .stats { color:var(--dim); font-size:12px; margin-top:16px; word-break:break-all; }
  .err { color:var(--err); }
  .empty { color:var(--dim); padding:24px 12px; text-align:center; }
</style>
</head>
<body>
<header>
  <h1>Mint Tracker &mdash; Robinhood Chain</h1>
  <div class="sub" id="sub">connecting&hellip;</div>
</header>

<div class="controls">
  <label><input type="checkbox" id="freeOnly"> free mints only</label>
  <label>top <input type="number" id="limit" value="40" min="5" max="200" style="width:64px"></label>
</div>

<div class="wrap">
<table>
  <thead><tr>
    <th>Contract</th>
    <th title="Mint attempts inside the velocity window">In window</th>
    <th>Total</th>
    <th title="Distinct minting addresses — the honest demand signal">Unique</th>
    <th>Free</th>
    <th>Age (s)</th>
    <th>Per min</th>
  </tr></thead>
  <tbody id="rows"></tbody>
</table>
</div>
<div class="stats" id="stats"></div>

<script>
const fmt = n => Number(n).toLocaleString();
const qs = new URLSearchParams(location.search);

function authHeaders() {
  const t = qs.get('token');
  return t ? { authorization: 'Bearer ' + t } : {};
}

async function tick() {
  const limit = document.getElementById('limit').value || 40;
  const freeOnly = document.getElementById('freeOnly').checked;
  try {
    const res = await fetch('/api/collections?limit=' + limit + (freeOnly ? '&free=true' : ''),
                            { headers: authHeaders() });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));

    document.getElementById('sub').textContent =
      'window ' + data.config.velocityWindowSec + 's · threshold ' +
      data.config.minAttempts + ' mints / ' + data.config.minUniqueMinters +
      ' unique · updated ' + new Date(data.generatedAt).toLocaleTimeString();

    const rows = data.collections || [];
    document.getElementById('rows').innerHTML = rows.length
      ? rows.map(c =>
          '<tr class="' + (c.flagged ? 'hot' : '') + '">' +
          '<td>' + c.contract + '</td>' +
          '<td>' + fmt(c.attemptsInWindow) + '</td>' +
          '<td>' + fmt(c.attempts) + '</td>' +
          '<td>' + fmt(c.uniqueMinters) + '</td>' +
          '<td class="' + (c.isFree ? 'free' : '') + '">' + (c.isFree ? 'yes' : 'no') + '</td>' +
          '<td>' + c.ageSec + '</td>' +
          '<td>' + c.attemptsPerMinute + '</td></tr>').join('')
      : '<tr><td colspan="7" class="empty">no mint activity observed yet</td></tr>';

    document.getElementById('stats').textContent = JSON.stringify(data.stats);
  } catch (err) {
    document.getElementById('sub').innerHTML = '<span class="err">' + err.message + '</span>';
  }
}

tick();
setInterval(tick, 4000);
document.getElementById('freeOnly').addEventListener('change', tick);
document.getElementById('limit').addEventListener('change', tick);
</script>
</body>
</html>
