    out.push('</div>');
  }

  /* Your own endpoint, layered over the shared one rather than replacing it. */
  var mine=(acctView&&acctView.rpcUrl)||'', shared=(acctView&&acctView.defaultRpcHost)||'';
  out.push('<div class="card flat"><div class="k">Your RPC</div>');
  out.push('<p class="lede">'+(mine
    ? 'Yours is tried first; the shared endpoint stays as the fallback.'
    : 'You are on the shared endpoint'+(shared? ' — <span class="mono">'+esc(shared)+'</span>':'')+
      '. Set your own to have it tried first.')+'</p>');
  out.push('<div class="hint">Ordering on this chain is first-come-first-served, so a nearer '+
    'endpoint is the only thing that wins races. Everyone here shares one by default; your own '+
    'is the way past that.</div>');
  out.push('<div style="margin-top:14px"><label for="rpc">RPC URL</label>'+
    '<input id="rpc" spellcheck="false" placeholder="'+
    (shared? 'shared: '+esc(shared) : 'https://…')+'" value="'+esc(mine)+'"></div>');
  out.push('<div class="acts"><button class="solid" onclick="saveRpc()"'+(busyLabel?' disabled':'')+
    '>Save</button>'+
    (mine? '<button onclick="clearRpc()">Use the shared one</button>':'')+
    '<button class="link" onclick="go(\'origin\')">see how fast it is</button></div>');
  out.push('</div>');
  return out.join('');
}

function hideKeys(){ revealed=null; render(); }

/* Funding ten wallets by hand means ten copies; one button is kinder. */
function copyAddresses(){
  var ws=(acctView&&acctView.wallets)||[], list=[];
  for(var i=0;i<ws.length;i++) list.push(ws[i].address);
  if(!list.length && acctView && acctView.addresses) list=acctView.addresses;
  var text=list.join('\n');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){
      $('copyState').textContent='copied '+list.length; },
      function(){ $('copyState').textContent='could not copy'; });
  } else { $('copyState').textContent='copying is not available here'; }
}

async function clearRpc(){ $('rpc').value=''; await saveRpc(); }

function signIn(){
  var id=$('inId').value.trim(), tok=$('inTok').value.trim();
  if(!id||!tok) return;
  setAcct({id:id,token:tok}); signupNotice=null;
  loadAccount(); loadFindings();
}

function saveOpToken(){
  var t=$('opTok').value.trim();
  if(!t) return;
  setOpTok(t);
  // The screen has to change on save, or a correct token looks like it did
  // nothing — which is exactly how this read before.
  log('Signed in as the operator.');
  loadAccount(); loadFindings(); render();
}

function signOutOperator(){ setOpTok(''); statusInfo=null; hist=null; render(); }

/* ── screen: rules ──────────────────────────────────────────────────────── */
function renderRules(){
  var cur=rules(), out=['<div class="card">'];
  out.push('<div class="top"><div><div class="k">Settings</div>'+
    '<h1 style="margin-top:4px">Rules</h1></div>'+
    '<button class="circ" onclick="go(\'mints\')" title="Back">×</button></div>');
  out.push('<p class="lede">Every rule must pass before it mints. The defaults are tuned for '+
    'free mints selling out fast — you only need this screen if they are too tight or too loose. '+
    'Saved in this browser.</p>');

  out.push('<div class="grid wide" style="margin-top:20px">');
  for(var i=0;i<RULES.length;i++){
    var r=RULES[i], custom=cur[r.key]!==undefined;
    var val=custom?cur[r.key]:(defaults?defaults[r.key]:'');
    out.push('<div><label>'+esc(r.label)+' <span class="mute">'+esc(r.unit)+'</span></label>'+
      '<input type="number" value="'+esc(val)+'" oninput="setRule(\''+r.key+'\',this.value)">'+
      '<div class="hint">'+esc(r.why)+'</div>'+
      '<div class="hint">'+(custom? 'changed — default '+esc(defaults?defaults[r.key]:'?') : 'default')+
      '</div></div>');
  }
  for(var j=0;j<FLAGS.length;j++){
    var f=FLAGS[j], isC=cur[f.key]!==undefined;
    var on=isC? cur[f.key]==='true' : (defaults? Boolean(defaults[f.key]) : true);
    out.push('<div><label style="display:flex;gap:9px;align-items:center;text-transform:none;'+
      'font-size:14px;letter-spacing:-.02em;color:var(--ink)">'+
      '<input type="checkbox" '+(on?'checked':'')+' onchange="setRule(\''+f.key+'\',this.checked)">'+
      esc(f.label)+'</label><div class="hint">'+esc(f.why)+'</div></div>');
  }
  out.push('</div>');
  out.push('<div class="acts"><button onclick="resetRules()">Reset to defaults</button></div>');
  out.push('<div class="hint">Spend limits live on the server and cannot be changed from here.</div>');
  out.push('</div>');
  return out.join('');
}

/**
 * Stop the meter when nobody is looking.
 *
 * Both loops call a server that holds the sequencer feed open for the length of
 * its sample, billed as active CPU throughout. A tab in the background is a
 * request nobody reads and an invoice somebody pays, so the loops idle while
 * hidden and pick up when the tab comes back.
 */
document.addEventListener('visibilitychange', function(){
  if(document.hidden){
    if(huntTimer){ clearTimeout(huntTimer); huntTimer=null; }
    return;
  }
  // Back in view: resume whichever loop was running.
  if(hunting && !huntTimer && !busyLabel){
    idleRounds=0;
    log('Resumed — tab is back in view.');
    huntTimer=setTimeout(runRound, 1000);
  }
  if(view==='live'){ boardIdle=0; if(!boardTimer) startBoard(); }
});

/* ── init ───────────────────────────────────────────────────────────────── */
if(localStorage.getItem('fm_practice')===null) localStorage.setItem('fm_practice','1');
window.addEventListener('beforeunload',function(e){
  if(hunting){ e.preventDefault(); e.returnValue=''; } });
render(); loadStatus(); loadFindings(); loadAccount();
</script>
