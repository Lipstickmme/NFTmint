<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Free Mint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!--
  Loaded without blocking the parser. A stylesheet in the head holds up every
  script after it, so a slow or unreachable font host would stall the whole app
  before a single line of it ran — the font is a preference, not a dependency.
  media="print" makes it non-blocking; onload promotes it once it arrives, and
  display=swap means the fallback stack shows immediately either way.
-->
<link rel="stylesheet" media="print" onload="this.media='all'"
  href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@300..700&display=swap">
<noscript><link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@300..700&display=swap"></noscript>
<style>
  /* One family, many weights — the reference gets its whole voice from Geist
     at 900 for numerals and 400-600 for everything else, with tight tracking. */
  :root{
    --page:#e6e6e3; --card:#fbfbfa; --sunk:#f1f1ee;
    --ink:#0a0a0a; --mute:#8d8d87; --line:#e6e6e1;
    --inv:#0a0a0a; --inv-ink:#fbfbfa;
    --ok:#127a45; --warn:#8a5a00; --err:#c2314a;
    --r:30px; --rs:18px; --rxs:13px;
  }
  *{box-sizing:border-box}
  html{background:var(--page)}
  body{margin:0;padding:20px 14px 120px;background:var(--page);color:var(--ink);
    font-family:Geist,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:15px;line-height:1.45;font-weight:450;letter-spacing:-.014em;
    -webkit-font-smoothing:antialiased}
  .shell{max-width:560px;margin:0 auto}
  .mono{font-family:"Geist Mono",ui-monospace,Menlo,monospace;font-weight:400}

  .card{background:var(--card);border-radius:var(--r);padding:24px 22px;margin-bottom:12px}
  .card.flat{padding:20px 22px}

  /* ── type scale ───────────────────────────────────────────────────────── */
  h1{font-size:30px;font-weight:600;letter-spacing:-.045em;margin:0}
  h2{font-size:21px;font-weight:600;letter-spacing:-.035em;margin:0}
  /* The oversized numeral. 900 weight, negative tracking, cropped leading. */
  .num{font-weight:900;letter-spacing:-.06em;line-height:.82;font-variant-numeric:tabular-nums}
  .num.xxl{font-size:118px}
  .num.xl{font-size:64px}
  .num.l{font-size:30px}
  .num.m{font-size:22px}
  /* The huge lowercase-tight place name from the reference. */
  .display{font-size:44px;font-weight:600;letter-spacing:-.05em;line-height:.98;margin:0}
  .k{font-size:9.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
  .lede{color:var(--mute);font-size:13.5px;margin:6px 0 0;letter-spacing:-.01em}
  .hint{color:var(--mute);font-size:12px;margin-top:8px;line-height:1.5}
  .mute{color:var(--mute)} .ok{color:var(--ok)} .bad{color:var(--err)} .warnc{color:var(--warn)}
  b,strong{font-weight:600}

  /* ── header ───────────────────────────────────────────────────────────── */
  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}
  .thumbs{display:flex;gap:6px}
  .thumb{width:34px;height:34px;border-radius:10px;object-fit:cover;background:var(--sunk);flex:none}
  .thumb.big{width:60px;height:60px;border-radius:16px}
  .thumb.ph{display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--mute)}
  .circ{width:38px;height:38px;border-radius:50%;border:none;background:var(--sunk);
    color:var(--ink);font-size:19px;font-weight:400;line-height:1;padding:0;flex:none;
    display:flex;align-items:center;justify-content:center;cursor:pointer}
  .circ:hover{background:var(--line)}

  /* ── rows ─────────────────────────────────────────────────────────────── */
  .row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:var(--rs);
    background:var(--sunk);margin-bottom:7px;text-align:left;width:100%;border:none;
    font-family:inherit;color:inherit;cursor:pointer}
  .row:last-child{margin-bottom:0}
  .row.static{cursor:default}
  .row.sel{background:var(--inv);color:var(--inv-ink)}
  .row.sel .k{color:rgba(251,251,250,.55)}
  .row .grow{flex:1;min-width:0}
  .row .name{font-size:14.5px;font-weight:550;letter-spacing:-.02em;margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* Except a payment address, which has to be checkable in full — an ellipsis
     there hides exactly the characters someone would use to spot a wrong one. */
  .row .name.full{white-space:normal;overflow:visible;text-overflow:clip;
    word-break:break-all;font-size:13px;line-height:1.35}
  .row .right{flex:none;display:flex;align-items:center;gap:9px}
  .glyph{font-size:15px;line-height:1;flex:none}

  /* ── buttons ──────────────────────────────────────────────────────────── */
  /* Glass, not paint. Every button is a translucent pane over the page with a
     lit top edge and a shadow beneath it, so it reads as a physical thing you
     can press rather than a coloured rectangle. The transition is on transform
     and shadow only — both composited, so a press stays smooth on a phone. */
  button{font-family:inherit;font-size:13.5px;font-weight:550;letter-spacing:-.015em;
    cursor:pointer;border:none;color:var(--ink);
    padding:12px 20px;border-radius:99px;position:relative;isolation:isolate;
    background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.35)),var(--sunk);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(10,10,10,.05),
      0 1px 2px rgba(10,10,10,.06);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    transition:transform .16s cubic-bezier(.2,.8,.2,1),box-shadow .16s ease,filter .16s ease}
  button:hover:not(:disabled){transform:translateY(-1px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 4px 12px rgba(10,10,10,.1)}
  button:active:not(:disabled){transform:translateY(.5px) scale(.99);
    box-shadow:inset 0 1px 3px rgba(10,10,10,.14)}
  button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  button:disabled{opacity:.35;cursor:not-allowed}

  /* The primary action: dark glass that glows. The glow is the button's own
     colour thrown downward, not a generic drop shadow, so it reads as light
     coming off the control. */
  .solid{background:linear-gradient(180deg,#242423,var(--inv));color:var(--inv-ink);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 2px 6px rgba(10,10,10,.24),
      0 8px 22px -8px rgba(10,10,10,.5)}
  .solid:hover:not(:disabled){box-shadow:inset 0 1px 0 rgba(255,255,255,.22),
    0 4px 10px rgba(10,10,10,.26),0 14px 34px -10px rgba(10,10,10,.58)}
  .solid:active:not(:disabled){box-shadow:inset 0 2px 5px rgba(0,0,0,.4)}

  /* Reserved for the one action a screen is actually about — paying, minting.
     A slow breath rather than a blink: something you notice without it
     demanding attention, and it stops the moment the pointer arrives. */
  .glow{animation:pulse 3.2s ease-in-out infinite}
  .glow:hover,.glow:active{animation:none}
  @keyframes pulse{
    0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 2px 6px rgba(10,10,10,.24),
      0 8px 22px -8px rgba(10,10,10,.5)}
    50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 2px 8px rgba(10,10,10,.3),
      0 16px 40px -8px rgba(10,10,10,.62)}
  }
  .danger{background:linear-gradient(180deg,#d0455c,var(--err));color:#fff;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 6px 18px -8px rgba(194,49,74,.7)}

  /* Line icons, sized to the text they sit beside. currentColor throughout, so
     one sprite works on both the light rows and the dark ones. */
  .i{width:1em;height:1em;flex:none;vertical-align:-.125em;
    fill:none;stroke:currentColor;stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round}
  .i.lg{width:1.25em;height:1.25em;stroke-width:1.6}
  button .i{margin-right:7px;vertical-align:-.14em}
  button.icon-only .i{margin-right:0}
  .wide{width:100%;padding:15px 22px;font-size:15px}
  .link{background:none;padding:0;font-size:12.5px;color:var(--mute);
    text-decoration:underline;text-underline-offset:3px;border-radius:0}
  .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px}

  /* Segmented control, as in the 12h/24h pill. */
  .seg{display:inline-flex;background:var(--sunk);border-radius:99px;padding:3px;gap:2px}
  .seg button{padding:8px 16px;font-size:12px;font-weight:550;background:none;border-radius:99px}
  .seg button.on{background:var(--inv);color:var(--inv-ink)}

  /* ── inputs ───────────────────────────────────────────────────────────── */
  label{display:block;font-size:9.5px;font-weight:600;letter-spacing:.12em;
    text-transform:uppercase;color:var(--mute);margin-bottom:7px}
  input,textarea{width:100%;padding:14px 16px;border-radius:var(--rs);border:1px solid transparent;
    background:var(--sunk);color:var(--ink);font-family:inherit;font-size:14.5px;font-weight:450;
    letter-spacing:-.015em}
  input:focus,textarea:focus{outline:none;border-color:var(--ink)}
  textarea{min-height:56px;resize:vertical;font-family:"Geist Mono",Menlo,monospace;font-size:12px}
  input[type=checkbox]{width:auto;accent-color:var(--inv)}
  /* Two columns on a phone, more when there is room. 210px would collapse to a
     single column at 430px wide, which is most of the traffic. */
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:14px 18px}
  .grid.wide{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}

  .msg{padding:13px 16px;border-radius:var(--rs);font-size:13px;margin:10px 0;background:var(--sunk)}
  .msg.ok{color:var(--ok)} .msg.err{color:var(--err)} .msg.warn{color:var(--warn)}

  .chip{display:inline-block;padding:4px 10px;border-radius:99px;font-size:9.5px;
    font-weight:600;letter-spacing:.08em;text-transform:uppercase;background:var(--card);color:var(--mute)}
  .chip.on{background:var(--inv);color:var(--inv-ink)}
  .chip.good{background:var(--ok);color:#fff}

  .bar{height:5px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0 4px}
  .bar>div{height:100%;border-radius:99px;background:var(--inv);
    transition:width .6s cubic-bezier(.2,.7,.3,1)}
  /* A bar that is still filling sweeps, so "moving" is visible at a glance
     rather than requiring two readings a minute apart. */
  .bar.moving>div{background:linear-gradient(90deg,var(--inv) 0%,var(--mute) 50%,var(--inv) 100%);
    background-size:220% 100%;animation:sweep 1.6s linear infinite}
  .bar.done>div{background:var(--mute)}
  @keyframes sweep{to{background-position:-220% 0}}

  /* Event chips. Only the urgent one pulses — if everything moved, nothing
     would read as urgent. */
  .ev{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;
    font-size:10.5px;font-weight:600;letter-spacing:.02em;background:var(--sunk);
    color:var(--mute);margin:6px 6px 0 0}
  .ev.minting-out{background:var(--inv);color:var(--inv-ink);animation:breathe 1.9s ease-in-out infinite}
  .ev.sold-out{background:var(--line);color:var(--mute)}
  .ev.fast,.ev.crowd{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
  @keyframes breathe{0%,100%{opacity:1}50%{opacity:.55}}
  .ev .dot{width:5px;height:5px;border-radius:50%;background:currentColor}
  .ev.minting-out .dot{animation:blink 1s steps(2,end) infinite}
  @keyframes blink{50%{opacity:.2}}

  /* A row that just appeared should say so. */
  .liverow{animation:rise .45s cubic-bezier(.2,.7,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  @media (prefers-reduced-motion:reduce){
    .bar.moving>div,.ev.minting-out,.ev.minting-out .dot,.liverow{animation:none}
    .bar>div{transition:none}
  }

  /* ── one-line rows ────────────────────────────────────────────────────
     A card per collection meant only three fitted on a screen. These are
     dense enough to compare a dozen at a glance, which is the actual job. */
  .mintcard{background:var(--sunk);border-radius:var(--rxs);padding:9px 11px;margin-bottom:5px;
    display:flex;align-items:center;gap:10px;cursor:pointer}
  .mintcard:hover{background:var(--line)}
  .mintcard.out{opacity:.5}
  .mintcard .thumb{width:30px;height:30px;border-radius:8px}
  .mintcard .grow{flex:1;min-width:0}
  .mintcard .name{font-size:13.5px;font-weight:600;letter-spacing:-.02em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* The metric strip: label in grey, value coloured by its verdict. */
  /* Wraps rather than truncating: cutting the strip off hides exactly the
     metrics at the end, which are the ones about supply and timing. */
  .strip{font-size:11px;font-weight:500;letter-spacing:-.005em;color:var(--mute);
    margin-top:2px;line-height:1.35;display:flex;flex-wrap:wrap;gap:0 7px}
  .strip b{font-weight:650}
  .strip .sep{display:none}
  .good{color:var(--ok)} .bad{color:var(--err)} .neutral{color:var(--ink)}

  .mintcard .pct{flex:none;text-align:right;width:46px}
  .mintcard .pct .num{font-size:17px}
  .minibar{height:3px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:3px}
  .minibar>div{height:100%;border-radius:99px;background:var(--inv)}
  .minibar.moving>div{background:linear-gradient(90deg,var(--inv),var(--mute),var(--inv));
    background-size:220% 100%;animation:sweep 1.6s linear infinite}
  .minibar.done>div{background:var(--mute)}
  .mintcard .go{flex:none;padding:7px 13px;font-size:11.5px;border-radius:99px}

  /* A row that just appeared at the top should announce itself. */
  .mintcard.fresh{animation:dropin .5s cubic-bezier(.2,.7,.3,1) both}
  @keyframes dropin{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    .mintcard.fresh,.minibar.moving>div{animation:none}
  }

  .chk{display:grid;grid-template-columns:14px 1fr;gap:9px;padding:8px 0;font-size:12.5px;
    border-bottom:1px solid var(--line)}
  .chk:last-child{border-bottom:none}
  .chk .why{color:var(--mute);font-size:11px;margin-top:2px}

  .log{margin-top:14px;font-family:"Geist Mono",Menlo,monospace;font-size:11px;
    max-height:150px;overflow-y:auto}
  .log div{padding:6px 0;border-bottom:1px solid var(--line);color:var(--mute)}
  .log div:last-child{border-bottom:none}

  /* ── latency scale, echoing the UTC ruler ─────────────────────────────── */
  .scale{display:flex;justify-content:space-between;margin-top:14px;padding-top:11px;
    border-top:1px solid var(--line)}
  .scale span{font-size:9.5px;font-weight:500;letter-spacing:.04em;color:var(--mute)}
  .scale span.on{color:var(--ink);font-weight:650}

  /* Concentric reach graphic — deliberately abstract, not a fake map. */
  .reach{position:relative;height:190px;margin:6px -8px 0;display:flex;
    align-items:center;justify-content:center}
  .reach i{position:absolute;border-radius:50%;border:1px solid var(--line)}
  .reach .dot{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--inv);border:none}
  .reach .pin{position:absolute;font-size:9.5px;font-weight:600;letter-spacing:.06em;
    text-transform:uppercase;color:var(--mute);white-space:nowrap}

  .keyrow{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--sunk);
    border-radius:var(--rxs);margin-bottom:6px;font-family:"Geist Mono",Menlo,monospace;
    font-size:11px;word-break:break-all}
  .keyrow .grow{flex:1;min-width:0}

  details{margin-top:14px}
  summary{cursor:pointer;font-size:12.5px;font-weight:550;color:var(--mute);list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::after{content:' ›';font-weight:700}
  details[open]>summary::after{content:' ⌄'}

  .spin{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;
    border:2px solid var(--line);border-top-color:var(--ink);animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* ── bottom nav ───────────────────────────────────────────────────────── */
  /* Thumb-height and above the home indicator: this is a phone control first,
     and a bar that sits under the iOS gesture area is a bar you cannot press. */
  .nav{position:fixed;left:0;right:0;z-index:20;display:flex;justify-content:center;gap:9px;
    pointer-events:none;bottom:calc(18px + env(safe-area-inset-bottom,0px))}
  .nav button{pointer-events:auto;width:54px;height:54px;border-radius:50%;padding:0;
    background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(251,251,250,.78)),var(--card);
    font-size:18px;display:flex;align-items:center;justify-content:center;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 8px 26px rgba(10,10,10,.14)}
  .nav button .i{width:21px;height:21px;margin:0}
  .nav button.on{background:linear-gradient(180deg,#242423,var(--inv));color:var(--inv-ink);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 30px -8px rgba(10,10,10,.6)}
  .nav button.on .i{stroke-width:1.9}

  /* ── mobile first ─────────────────────────────────────────────────────── */
  /* The oversized numerals are the design, but 118px does not fit a 320px
     screen — and a number that wraps stops being a number and becomes noise. */
  @media (max-width:400px){
    body{padding:16px 11px 116px}
    .card{padding:20px 17px;border-radius:24px}
    .num.xxl{font-size:88px} .num.xl{font-size:52px}
    .display{font-size:35px}
    h1{font-size:26px}
    .acts button{flex:1 1 auto;min-width:0}
  }
  /* Coarse pointers get full-height targets and no hover lift — a phone has no
     hover, and the transform just makes taps feel loose. */
  @media (hover:none){
    button:hover:not(:disabled){transform:none}
    .row{padding:15px 16px}
    button{min-height:44px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important}
  }

  footer{text-align:center;color:var(--mute);font-size:11px;margin-top:16px;
    padding-bottom:env(safe-area-inset-bottom,0px)}
</style>
</head>
<body>
<div class="shell">
  <div id="app"></div>
  <footer id="build"></footer>
</div>

<!-- One sprite, referenced by <use> everywhere. Line icons at a single stroke
     weight read as a set; the emoji they replaced rendered differently on every
     platform and could not take the colour of the row they sat in. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <g id="ic-target"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></g>
  <g id="ic-pulse"><path d="M2 12h4l3-7 4 14 3-7h6"/></g>
  <g id="ic-wallet"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18"/><circle cx="16.5" cy="14.5" r="1.2"/></g>
  <g id="ic-sliders"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></g>
  <g id="ic-check"><path d="M4 12.5l5 5L20 6.5"/></g>
  <g id="ic-x"><path d="M6 6l12 12M18 6L6 18"/></g>
  <g id="ic-spark"><path d="M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z"/></g>
  <g id="ic-key"><circle cx="8" cy="12" r="4"/><path d="M12 12h9M18 12v3M15 12v2"/></g>
  <g id="ic-copy"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></g>
  <g id="ic-power"><path d="M12 4v8"/><path d="M7.5 6.5a7 7 0 1 0 9 0"/></g>
  <g id="ic-clock"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></g>
  <g id="ic-arrow"><path d="M5 12h13M13 6.5l5.5 5.5L13 17.5"/></g>
  <g id="ic-warn"><path d="M12 4.5L21 20H3z"/><path d="M12 10v4.5M12 17.4v.2"/></g>
  <g id="ic-link"><path d="M10.5 13.5a4 4 0 0 0 5.7 0l2.6-2.6a4 4 0 0 0-5.7-5.7l-1.3 1.3"/><path d="M13.5 10.5a4 4 0 0 0-5.7 0l-2.6 2.6a4 4 0 0 0 5.7 5.7l1.3-1.3"/></g>
</defs></svg>

<nav class="nav" aria-label="Sections">
  <button id="navMints"   onclick="go('mints')"   title="Mints"        aria-label="Mints">      <svg class="i" viewBox="0 0 24 24"><use href="#ic-target"/></svg></button>
  <button id="navLive"    onclick="go('live')"    title="Minting now"  aria-label="Minting now"><svg class="i" viewBox="0 0 24 24"><use href="#ic-pulse"/></svg></button>
  <button id="navAccount" onclick="go('account')" title="Your wallets" aria-label="Your wallets"><svg class="i" viewBox="0 0 24 24"><use href="#ic-wallet"/></svg></button>
  <button id="navRules"   onclick="go('rules')"   title="Rules"        aria-label="Rules">      <svg class="i" viewBox="0 0 24 24"><use href="#ic-sliders"/></svg></button>
</nav>

<script>
'use strict';
var PAGE_VERSION = '15-billing';

/* ── state ──────────────────────────────────────────────────────────────── */
var view='mints', tab='passed', hunting=false, rounds=0, selected=null;
var hist=null, origin=null, acctView=null, revealed=null, defaults=null, health=null;
var billing=null, subMsg=null;
var board=null, boardTimer=null, minting={}, huntTimer=null, boardIdle=0;
var seenArt=[], logLines=[], busyLabel='', signupNotice=null, statusInfo=null;

/* ── helpers ────────────────────────────────────────────────────────────── */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s===null||s===undefined?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
/* Only schemes that render or navigate — never one that executes. Artwork URLs
   come from token metadata, written by whoever deployed the contract. */
function safeUrl(u){ var t=String(u===null||u===undefined?'':u).trim();
  return /^(https?:|data:image\/)/i.test(t)? t : ''; }
function addrOnly(a){ return /^0x[0-9a-fA-F]{40}$/.test(String(a))? String(a) : ''; }
function shortAddr(a){ return a? a.slice(0,6)+'…'+a.slice(-4) : ''; }
function msg(k,t){ return '<div class="msg '+k+'">'+t+'</div>'; }
function fmtDur(s){ if(s===null||s===undefined||!isFinite(s)) return '—';
  return s<60?Math.round(s)+'s':s<3600?Math.round(s/60)+'m':(s/3600).toFixed(1)+'h'; }
function fmtTime(iso){ var d=new Date(iso); return isNaN(d.getTime())?'—':d.toLocaleTimeString(); }
function num(v,cls){ return '<div class="num '+(cls||'l')+'">'+esc(v)+'</div>'; }

/* One icon from the sprite. Takes the colour of whatever it sits in. */
function ic(name,cls){
  return '<svg class="i'+(cls?' '+cls:'')+'" viewBox="0 0 24 24" aria-hidden="true">'+
    '<use href="#ic-'+name+'"/></svg>';
}

/* ── credentials ────────────────────────────────────────────────────────── */
function acct(){ try{ return JSON.parse(localStorage.getItem('fm_account')||'null'); }
  catch(e){ return null; } }
function setAcct(a){ if(a) localStorage.setItem('fm_account',JSON.stringify(a));
  else localStorage.removeItem('fm_account'); }
function opTok(){ return localStorage.getItem('fm_optoken')||''; }
function setOpTok(t){ if(t) localStorage.setItem('fm_optoken',t);
  else localStorage.removeItem('fm_optoken'); }
function signedIn(){ return mode()!=='out'; }
/**
 * Who is driving.
 *
 * 'account'  — a signed-up user, minting from generated wallets.
 * 'operator' — the deployment's own API_TOKEN and PRIVATE_KEYS.
 * Both reach the same screens; only the wallets and the history differ.
 */
function mode(){ var a=acct();
  if(a&&a.id&&a.token) return 'account';
  if(opTok()) return 'operator';
  return 'out'; }

async function api(path,opt){
  opt=opt||{};
  var h={'content-type':'application/json'}, a=acct();
  if(a&&a.id&&a.token){ h['x-account-id']=a.id; h['x-account-token']=a.token; }
  else if(opTok()) h.authorization='Bearer '+opTok();
  var res=await fetch(path,{method:opt.method||'GET',body:opt.body,headers:h});
  var txt=await res.text(), body;
  try{ body=JSON.parse(txt); }catch(e){ throw new Error('Server error (HTTP '+res.status+')'); }
  if(!res.ok) throw new Error(body.error||('HTTP '+res.status));
  return body;
}

function log(t){ logLines.unshift(new Date().toLocaleTimeString()+'  '+t);
  logLines=logLines.slice(0,40); }

function noteArt(url){ var u=safeUrl(url);
  if(!u||seenArt.indexOf(u)>=0) return;
  seenArt.unshift(u); seenArt=seenArt.slice(0,4); }

function thumbs(){
  if(!seenArt.length) return '<div class="thumbs"></div>';
  var out=[];
  for(var i=0;i<seenArt.length;i++)
    out.push('<img class="thumb" src="'+esc(seenArt[i])+'" alt="" loading="lazy" '+
      'onerror="this.style.display=\'none\'">');
  return '<div class="thumbs">'+out.join('')+'</div>';
}

/* ── navigation ─────────────────────────────────────────────────────────── */
function go(v){
  // The board keeps refreshing while you are looking at it and stops when you
  // are not: each round holds the sequencer feed open for twenty seconds.
  if(view==='live' && v!=='live') stopBoard();
  view=v; selected=null; render();
  if(v==='live') startBoard();
  if(v==='origin') loadOrigin();
  if(v==='account') loadAccount();
  if(v==='mints') loadFindings();
  window.scrollTo({top:0,behavior:'smooth'}); }

function openMint(contract){
  for(var i=0;i<((hist&&hist.findings)||[]).length;i++)
    if(hist.findings[i].contract===contract){ selected=hist.findings[i]; break; }
  view='detail'; render(); window.scrollTo({top:0,behavior:'smooth'});
}

/* ── loaders ────────────────────────────────────────────────────────────── */
async function loadFindings(){
  if(!signedIn()){ hist=null; render(); return; }
  try{
    hist=await api('/api/findings?limit=60&filter=all');
    for(var i=0;i<hist.findings.length;i++) noteArt(hist.findings[i].imageUrl);
  }catch(e){ hist={error:e.message,findings:[],passed:0,close:0}; }
  render();
}

async function loadOrigin(){
  if(!signedIn()){ origin=null; render(); return; }
  origin='loading'; render();
  try{ origin=await api('/api/origin'); }
  catch(e){ origin={error:e.message}; }
  render();
}

async function loadAccount(){
  var m=mode();
  if(m==='out'){ acctView=null; statusInfo=null; render(); return; }
  if(m==='operator'){
    // The operator has no generated wallets; /api/status describes the ones
    // the deployment was configured with instead.
    try{ statusInfo=await api('/api/status'); }
    catch(e){ statusInfo={error:e.message}; }
    render(); return;
  }
  try{ acctView=await api('/api/account'); }
  catch(e){ acctView={error:e.message}; }
  // What auto-mint costs and whether this account has paid. Asked alongside
  // the account rather than only when the user goes looking, so the screen can
  // say why the switch is not doing anything.
  try{ billing=await api('/api/subscribe'); }
  catch(e){ billing={error:e.message}; }
  render();
}

async function loadStatus(){
  try{
    // Public, so the settings screen can label its own inputs before anyone has
    // signed in — and so a stale page identifies itself in the same request.
    health=await api('/api/health');
    defaults=health.criteria||null;
    // The commit hash is noise for anyone using the app. The one thing worth
    // interrupting for is a cached page talking to a newer server, because that
    // looks like broken behaviour rather than a stale asset.
    $('build').innerHTML = health.build && health.build.uiVersion!==PAGE_VERSION
      ? '<span class="bad">This page is cached and out of date — hard-refresh.</span>'
      : '';
  }catch(e){ /* the footer is decoration; never let it break the page */ }
  render();
}

/** Setup problems worth interrupting for, in the words the API used. */
function setupWarning(){
  if(!health||!health.problems||!health.problems.length) return '';
  var out=[];
  for(var i=0;i<health.problems.length;i++) out.push(msg('warn',esc(health.problems[i])));
  return out.join('');
}

/* ── sign up ────────────────────────────────────────────────────────────── */
async function signUp(){
  busyLabel='generating 10 wallets'; render();
  try{
    var r=await api('/api/account',{method:'POST'});
    setAcct({id:r.id,token:r.token});
    signupNotice=r;
    await loadAccount();
    log('Account '+r.id+' created with '+r.walletCount+' wallets.');
  }catch(e){ signupNotice={error:e.message}; }
  busyLabel=''; render();
}

function signOut(){
  if(!confirm('Sign out?\n\nYour wallets stay on the server, but you need your '+
    'account key to get back in. If you did not save it, this is permanent.')) return;
  setAcct(null); acctView=null; revealed=null; hist=null; signupNotice=null; render();
}

async function revealKeys(){
  if(!confirm('Show your private keys?\n\nAnyone who sees them can spend anything '+
    'these wallets hold.')) return;
  try{ revealed=await api('/api/account?reveal=1'); }
  catch(e){ revealed={error:e.message}; }
  render();
}

async function saveRpc(){
  var url=$('rpc').value.trim();
  busyLabel='saving'; render();
  try{ acctView=await api('/api/account',{method:'PATCH',body:JSON.stringify({rpcUrl:url})});
       log(url? 'RPC set to '+url : 'RPC cleared — using the default.'); }
  catch(e){ acctView=Object.assign({},acctView,{error:e.message}); }
  busyLabel=''; render(); loadAccount();
}

async function toggleAuto(on){
  try{ acctView=await api('/api/account',{method:'PATCH',body:JSON.stringify({autoMint:on})}); }
  catch(e){ acctView=Object.assign({},acctView,{error:e.message}); }
  render();
}

/* ── hunting ────────────────────────────────────────────────────────────── */
function toggleHunt(){ if(hunting) stopHunt(); else startHunt(); }

function startHunt(){
  if(!signedIn()){ go('account'); return; }
  idleRounds=0;
  if(!isPractice() && !confirm('Live mode spends real gas automatically whenever a '+
    'collection passes every rule.\n\nStart hunting?')) return;
  hunting=true; log(isPractice()? 'Started in practice mode.' : 'Started LIVE.');
  render(); runRound();
}

function stopHunt(){
  hunting=false;
  if(huntTimer){ clearTimeout(huntTimer); huntTimer=null; }
  log('Stopped.'); render();
}

function isPractice(){ return localStorage.getItem('fm_practice')!=='0'; }
function setPractice(on){ localStorage.setItem('fm_practice',on?'1':'0'); render(); }

/**
 * How long a loop may keep running with nothing to show for it.
 *
 * Every round is billed as active CPU on the host, so a tab nobody is watching
 * is a meter nobody is reading. One left open overnight cost eight hours of
 * compute and paused the account it was billed to; these two limits are what
 * stop that happening again.
 */
var IDLE_ROUND_LIMIT=40;
var HUNT_COOLDOWN_MS=45000;
var idleRounds=0;

async function runRound(single){
  rounds++; busyLabel='round '+rounds+' — listening'; render();
  try{
    var r=await api('/api/hunt?dryRun='+String(isPractice())+'&'+ruleQuery());
    if(r.cooldownSec) HUNT_COOLDOWN_MS=Math.max(5000, r.cooldownSec*1000);
    if(r.paused){ log('Auto-mint is off for this account.'); hunting=false; }
    else if(r.skipped){ log('Skipped — a round was already running.'); }
    else{
      idleRounds = r.mintedCollections>0 ? 0 : idleRounds+1;
      log(r.observed.mintsSeen+' mints seen · '+r.candidates.length+' checked · '+
          r.qualified+' passed'+(r.mintedCollections?' · '+r.mintedCollections+' MINTED':''));
      for(var i=0;i<r.candidates.length;i++){
        var c=r.candidates[i];
        if(c.evaluation.passed && c.minted && c.minted.error) log('NOT MINTED — '+c.minted.error);
      }
      if(!r.feedConnected) log('Could not reach the chain feed.');
      await loadFindings();
    }
  }catch(e){
    log('Error: '+e.message);
    if(/token|account|sign/i.test(e.message)) hunting=false;
  }
  busyLabel=''; render();
  if(single || !hunting) return;

  // Stop rather than run unattended forever. The cost of a round is paid
  // whether or not anyone is looking at the result.
  if(idleRounds>=IDLE_ROUND_LIMIT){
    hunting=false;
    log('Stopped after '+idleRounds+' rounds with nothing to mint. Press Start '+
        'hunting to carry on — this exists so a forgotten tab does not keep '+
        'spending compute.');
    render();
    return;
  }
  // Paused rather than stopped: switching tabs should not lose your place, but
  // it should stop the meter.
  if(document.hidden){ log('Paused — this tab is in the background.'); render(); return; }

  huntTimer=setTimeout(runRound, HUNT_COOLDOWN_MS);
}

/* ── rules ──────────────────────────────────────────────────────────────── */
var RULES=[
 {key:'minMintsPerMinute',label:'Mint speed',unit:'per minute',
  why:'How fast people are minting. Something selling out moves quickly.'},
 {key:'minUniqueMinters',label:'Different wallets',unit:'wallets',
  why:'The anti-bot check, and the dial worth most. 300 mints from 4 wallets is one bot.'},
 {key:'minAttemptsInWindow',label:'Mints in window',unit:'mints',
  why:'Enough activity to be a real rush, not a trickle.'},
 {key:'maxAgeSec',label:'Newer than',unit:'seconds',
  why:'Joining late usually means the supply is gone.'},
 {key:'maxSelloutSec',label:'Sells out within',unit:'seconds',
  why:'Supply left ÷ current speed. Fast minting against unlimited supply is not scarcity.'},
 {key:'maxSupplyProgressPct',label:'Skip past',unit:'% minted',
  why:'Beyond this you will likely lose the race and pay gas for nothing.'}
];
var FLAGS=[
 {key:'freeOnly',label:'Free mints only',why:'Worst case is the gas.'},
 {key:'requireLive',label:'Must still be minting',why:'A gap means it already finished.'},
 {key:'requireSaleOpen',label:'Respect the sale switch',why:'If the contract says open, believe it.'},
 {key:'skipIfOwned',label:'Skip ones you own',why:'Checked on chain, so rounds do not rebuy.'}
];
function rules(){ try{ return JSON.parse(localStorage.getItem('fm_rules')||'{}'); }
  catch(e){ return {}; } }
function setRule(k,v){ var r=rules();
  if(v===''||v===null||v===undefined) delete r[k]; else r[k]=String(v);
  localStorage.setItem('fm_rules',JSON.stringify(r)); render(); }
function resetRules(){ localStorage.removeItem('fm_rules'); render(); }
function ruleQuery(){ var q=[], r=rules(), keys=Object.keys(r);
  for(var i=0;i<keys.length;i++) q.push(encodeURIComponent(keys[i])+'='+encodeURIComponent(r[keys[i]]));
  return q.join('&'); }

/* ── render ─────────────────────────────────────────────────────────────── */
function render(){
  var ids=['navMints','navLive','navAccount','navRules'];
  var names=['mints','live','account','rules'];
  for(var i=0;i<ids.length;i++){
    var on = names[i]===view ||
      (view==='detail' && names[i]==='mints') ||
      (view==='origin' && names[i]==='account');
    $(ids[i]).className = on? 'on' : '';
  }
  var html =
    view==='detail'  ? renderDetail()  :
    view==='live'    ? renderLive()    :
    view==='origin'  ? renderOrigin()  :
    view==='account' ? renderAccount() :
    view==='rules'   ? renderRules()   : renderMints();
  $('app').innerHTML=html;
  // The live list owns its own DOM so its artwork survives a refresh.
  if(view==='live') paintLive();
}

/* ── screen: mints ──────────────────────────────────────────────────────── */
function renderMints(){
  var out=[];
  out.push('<div class="card">');
  out.push('<div class="top">'+thumbs()+
    '<button class="circ" onclick="go(\'rules\')" title="Rules">+</button></div>');
  out.push('<h1>Free Mints</h1>');

  if(!signedIn()){
    out.push('<p class="lede">Create an account and the bot hunts free mints for you, '+
      'across ten wallets at once.</p>');
    out.push('<div class="acts"><button class="solid wide" onclick="go(\'account\')">'+
      'Get started</button></div></div>');
    return out.join('');
  }

  var practice=isPractice();
  out.push('<p class="lede">'+(practice
    ? 'Practice mode — everything is prepared and signed, nothing is sent.'
    : 'Live — it mints automatically whenever a collection passes every rule.')+'</p>');

  out.push('<div class="acts">');
  out.push('<button class="'+(hunting?'danger':'solid')+'" onclick="toggleHunt()">'+
    (hunting?'Stop':'Start hunting')+'</button>');
  out.push('<div class="seg">'+
    '<button class="'+(practice?'on':'')+'" onclick="setPractice(true)">Practice</button>'+
    '<button class="'+(!practice?'on':'')+'" onclick="setPractice(false)">Live</button></div>');
  if(busyLabel) out.push('<span class="mute" style="font-size:12px">'+
    '<span class="spin"></span> '+esc(busyLabel)+'</span>');
  out.push('</div>');

  if(hunting) out.push('<div class="hint">Each round listens to the chain for a few '+
    'seconds, which costs server time — so hunting pauses when you switch tabs and '+
    'stops on its own after a long quiet stretch.</div>');

  if(logLines.length){
    out.push('<div class="log">');
    for(var i=0;i<logLines.length;i++) out.push('<div>'+esc(logLines[i])+'</div>');
    out.push('</div>');
  }
  out.push('</div>');

  out.push(renderList());
  return out.join('');
}

function renderList(){
  if(!hist) return '<div class="card"><p class="lede">Loading…</p></div>';
  if(hist.error) return '<div class="card">'+msg('err',esc(hist.error))+'</div>';

  var rows = tab==='passed'
    ? hist.findings.filter(function(f){ return f.passed; })
    : hist.findings.filter(function(f){ return !f.passed && (f.score||0)>=(hist.minScore||70); });

  var out=['<div class="card">'];
  out.push('<div class="seg" style="margin-bottom:16px">'+
    '<button class="'+(tab==='passed'?'on':'')+'" onclick="setTab(\'passed\')">'+
      'Passed '+esc(hist.passed||0)+'</button>'+
    '<button class="'+(tab==='close'?'on':'')+'" onclick="setTab(\'close\')">'+
      'Close '+esc(hist.close||0)+'</button></div>');

  out.push('<div class="k">'+(tab==='passed'
    ? 'Cleared every rule'
    : 'Scored '+esc(hist.minScore||70)+' or better but did not qualify')+'</div>');

  if(!rows.length){
    out.push('<p class="lede">'+(tab==='passed'
      ? 'Nothing has passed yet. Rounds keep looking while hunting is on.'
      : 'Nothing came close yet. These are the ones a small change to the rules '+
        'would have caught.')+'</p></div>');
    return out.join('');
  }

  out.push('<div style="margin-top:12px">');
  for(var i=0;i<rows.length;i++) out.push(mintRow(rows[i]));
  out.push('</div>');

  if(!hist.durable) out.push('<div class="hint">Held in memory only — attach a database '+
    'and this list survives restarts.</div>');
  out.push('</div>');
  return out.join('');
}

function setTab(t){ tab=t; render(); }

/* One list row: micro-label, name, oversized score, state glyph. */
function mintRow(f){
  var img=safeUrl(f.imageUrl);
  var art = img? '<img class="thumb" src="'+esc(img)+'" alt="" loading="lazy" '+
    'onerror="this.style.display=\'none\'">' : '';
  var live = f.minted>0? '★' : (f.projectedSelloutSec!==undefined&&f.projectedSelloutSec!==null? '☀' : '☾');
  var sub = f.minted>0? 'minted '+esc(f.minted)
    : f.floor? 'floor '+esc(f.floor)+' '+esc(f.floorCurrency||'ETH')
    : esc(f.mintsPerMinute)+'/min';

  return '<button class="row'+(f.passed?' sel':'')+'" onclick="openMint(\''+
    esc(addrOnly(f.contract))+'\')">'+art+
    '<div class="grow"><div class="k">'+esc(sub)+'</div>'+
    '<div class="name">'+esc(f.name||shortAddr(f.contract))+'</div></div>'+
    '<div class="right">'+num(f.score===undefined?'—':f.score,'l')+
    '<span class="glyph">'+live+'</span></div></button>';
}

/* ── screen: one mint, the oversized-number view ────────────────────────── */
function renderDetail(){
  var f=selected;
  if(!f) return '<div class="card"><p class="lede">Nothing selected.</p>'+
    '<div class="acts"><button onclick="go(\'mints\')">Back</button></div></div>';

  var img=safeUrl(f.imageUrl), out=['<div class="card">'];
  out.push('<div class="top">'+
    (img? '<img class="thumb big" src="'+esc(img)+'" alt="" onerror="this.style.display=\'none\'">'
        : '<div class="thumbs"></div>')+
    '<button class="circ" onclick="go(\''+(f.live?'live':'mints')+'\')" title="Back">×</button>'+
    '</div>');

  /* The reference's stacked giant numerals. For something the hunter judged
     that is its score; for a row off the live board it is how far through the
     supply the drop is, which is the number you actually want there. */
  var big, unit, caption;
  if(f.live){
    var lpct=f.live.progressPct;
    big = lpct===undefined||lpct===null ? '—' : Math.round(lpct);
    unit = lpct===undefined||lpct===null ? '' : '%';
    caption = f.live.soldOut ? 'minted out' : 'minted';
  } else {
    big = f.score===undefined? '—' : f.score;
    unit = '/100';
    caption = f.passed? 'passed' : 'close';
  }
  out.push('<div style="display:flex;align-items:flex-start;gap:16px;margin:6px 0 4px">');
  out.push('<div>'+num(big,'xxl')+'</div>');
  out.push('<div style="padding-top:10px">'+
    '<div class="num m mute">'+esc(unit)+'</div>'+
    '<div class="k" style="margin-top:10px">'+esc(caption)+'</div></div>');
  out.push('</div>');

  out.push('<h2 class="display" style="margin-top:14px">'+esc(f.name||shortAddr(f.contract))+'</h2>');
  out.push('<div class="hint mono">'+esc(f.contract)+'</div>');

  out.push('<div class="grid" style="margin-top:20px">');
  out.push(stat('mint speed', esc(f.mintsPerMinute)+'/min'));
  out.push(stat('wallets minting', esc(f.uniqueMinters)));
  out.push(stat('supply left', f.remaining!==undefined&&f.remaining!==null? esc(f.remaining):'—'));
  out.push(stat('sells out in', fmtDur(f.projectedSelloutSec)));
  if(f.live){
    out.push(stat('price', f.live.isFree? 'free' : esc(f.live.priceEth)+' ETH'));
    if(f.live.maxPerWallet) out.push(stat('max each', esc(f.live.maxPerWallet)));
    if(f.live.maxSupply) out.push(stat('max supply', esc(f.live.maxSupply)));
    if(f.live.phase) out.push(stat('round', esc(f.live.phase)));
  }
  out.push('</div>');

  if(f.live){
    var lp = f.live.progressPct;
    if(lp!==undefined&&lp!==null)
      out.push('<div class="bar'+(f.live.soldOut?' done':' moving')+'" style="margin-top:18px">'+
        '<div style="width:'+Math.max(0,Math.min(100,lp)).toFixed(1)+'%"></div></div>');
    for(var ei=0;ei<(f.live.events||[]).length;ei++)
      out.push('<span class="ev '+esc(f.live.events[ei].kind)+'"><span class="dot"></span>'+
        esc(f.live.events[ei].text)+'</span>');
    var laddr=addrOnly(f.contract);
    if(laddr && !f.live.soldOut)
      out.push('<div class="acts"><button class="solid" onclick="mintNow(\''+esc(laddr)+
        '\')">'+(isPractice()?'Practice mint':'Mint now')+'</button></div>');
  }
  out.push('</div>');

  /* What it turned out to be worth. Only meaningful for something already
     found and skipped — a collection still minting has no aftermarket yet. */
  if(f.live) return out.join('');

  out.push('<div class="card flat">');
  out.push('<div class="k">Floor now</div>');
  if(f.floor){
    out.push('<div style="display:flex;align-items:baseline;gap:10px;margin-top:8px">'+
      num(f.floor,'xl')+'<div class="num m mute">'+esc(f.floorCurrency||'ETH')+'</div></div>');
    if(!f.minted && f.missedValue)
      out.push('<div class="hint">Ten wallets would have held '+esc(f.missedValue)+' '+
        esc(f.floorCurrency||'ETH')+' worth. That is what skipping this one cost.</div>');
    if(f.minted>0)
      out.push('<div class="hint ok">You minted '+esc(f.minted)+' of these.</div>');
    out.push('<div class="hint">Checked '+esc(fmtTime(f.floorCheckedAt))+'.</div>');
  } else if(hist && hist.marketConfigured===false){
    out.push('<p class="lede">No marketplace is configured, so prices are unknown. Set '+
      'MARKET_API_URL and past mints show what they went on to be worth.</p>');
  } else {
    out.push('<p class="lede">No floor found for this collection yet.</p>');
  }
  out.push('</div>');

  /* Why it did or did not qualify. */
  out.push('<div class="card flat">');
  out.push('<div class="k">Verdict</div>');
  out.push('<p class="lede">'+esc(f.reason)+'</p>');
  if(f.minted>0) out.push(msg('ok','Minted — '+esc(f.minted)+' confirmed.'));
  else if(f.outcome) out.push(msg('warn','<b>Passed, but not minted.</b><br>'+esc(f.outcome)));
  else if(f.failedChecks&&f.failedChecks.length)
    out.push('<div class="hint">Short on <b>'+esc(f.failedChecks.join(', '))+'</b>. '+
      'The first one listed is furthest from passing, so it is the dial to loosen.</div>');

  // How the calldata was built. A mint that worked by copying a stranger's
  // transaction is a different kind of confidence from one that decoded a
  // known signature, and the difference is worth stating rather than hiding.
  if(f.how) out.push('<div class="hint"><b>How:</b> '+esc(f.how)+'</div>');
  if(f.entrypoint==='observed') out.push('<div class="hint">This collection uses an '+
    'entrypoint we do not recognise. It was found because a crowd of distinct wallets '+
    'kept calling it, and the call was verified against the contract before anything '+
    'was sent.</div>');

  out.push('<div class="bar"><div style="width:'+
    Math.max(0,Math.min(100,Number(f.score)||0))+'%"></div></div>');
  out.push('<div class="hint">First seen '+esc(fmtTime(f.firstSeenAt))+
    ' · last '+esc(fmtTime(f.lastSeenAt))+
    (f.timesSeen>1? ' · seen in '+esc(f.timesSeen)+' rounds':'')+'</div>');

  for(var i=0;i<((f.txUrls)||[]).length;i++){
    var href=safeUrl(f.txUrls[i]);
    if(href) out.push('<div class="hint"><a href="'+esc(href)+'" target="_blank" '+
      'rel="noopener">transaction '+(i+1)+'</a></div>');
  }
  out.push('</div>');
  return out.join('');
}

function stat(k,v){
  return '<div><div class="k">'+esc(k)+'</div><div class="num m" style="margin-top:6px">'+
    v+'</div></div>';
}

/* ── screen: live board ─────────────────────────────────────────────────── */
/**
 * What is minting right now.
 *
 * A different question from the hunter's list, and worth its own screen. The
 * hunter answers "should I buy this" and mostly says no, which is right for
 * spending money unattended and useless as a view of the chain. This answers
 * "what is happening", shows the numbers, and lets you decide.
 *
 * Rows are one line each. A card per collection meant three fitted on a screen,
 * which defeats the point — the job is comparing a dozen at a glance.
 */
var LIVE_PAGE=10;
var livePage=1;
/** Everything seen this session, so a drop that scrolls out is not lost. */
var liveHistory={};

/** Refreshes before the board stops on its own. About fifteen minutes. */
var BOARD_IDLE_LIMIT=20;
var BOARD_INTERVAL_MS=45000;

function startBoard(){
  if(boardTimer) return;
  boardIdle=0;
  loadBoard();
  // Every refresh holds the sequencer feed open on the server, and that time is
  // billed as active CPU. Forty-five seconds between six-second samples keeps
  // the board current at about a seventh of what it used to cost.
  boardTimer=setInterval(function(){
    if(view!=='live') return;
    // A backgrounded tab still fires timers, and the server still pays for the
    // request. Nobody is reading it, so nobody should be billed for it.
    if(document.hidden) return;
    if(boardIdle>=BOARD_IDLE_LIMIT){ stopBoard(); paintIdle(); return; }
    boardIdle++;
    loadBoard();
  }, BOARD_INTERVAL_MS);
}
function stopBoard(){ if(boardTimer){ clearInterval(boardTimer); boardTimer=null; } }

/** Say why the board stopped, and offer to carry on. */
function paintIdle(){
  var note=$('liveNote');
  if(note) note.innerHTML='Stopped watching after '+BOARD_IDLE_LIMIT+' refreshes. '+
    '<button class="link" onclick="startBoard()">Watch again</button> — this exists '+
    'so a forgotten tab does not keep spending compute.';
}

async function loadBoard(){
  if(!signedIn()){ board=null; render(); return; }
  var hadList=Boolean($('liveList'));
  if(board===null){ board='loading'; render(); }
  try{
    board=await api('/api/live?seconds=20&minMints='+encodeURIComponent(minMints()));
    for(var i=0;i<board.mints.length;i++){
      noteArt(board.mints[i].imageUrl);
      // Keep a copy so it can still be found after it stops minting.
      liveHistory[board.mints[i].contract]={row:board.mints[i],at:Date.now()};
    }
  }catch(e){ board={error:e.message,mints:[]}; }

  // Refreshing an existing board updates the summary line and the rows in
  // place. A full re-render would throw away every image and reload it.
  if(hadList && $('liveList') && !board.error){
    var note=$('liveNote');
    if(note) note.textContent=board.note||'';
    var seen=$('liveSeen');
    if(seen) seen.textContent=(board.observed.mintsSeen)+' mints seen';
    paintLive();
  } else {
    render();
  }
}

/**
 * The volume floor, defaulting to the loosest setting.
 *
 * This page is a window on the chain and the judgement belongs to whoever is
 * reading it — so the default has to err toward showing a row, not hiding one.
 */
function minMints(){ return localStorage.getItem('fm_minmints')||'2'; }
function setMinMints(v){
  localStorage.setItem('fm_minmints',String(v)); livePage=1; boardIdle=0; loadBoard();
}
function showMore(){ livePage++; paintLive(); }

function renderLive(){
  var out=['<div class="card">'];
  out.push('<div class="top">'+thumbs()+
    '<button class="circ" onclick="boardIdle=0;loadBoard()" title="Watch again">↻</button>'+
    '</div>');
  out.push('<h1>Minting now</h1>');

  if(!signedIn()){
    out.push('<p class="lede">Sign in to watch the chain.</p>'+
      '<div class="acts"><button class="solid wide" onclick="go(\'account\')">Get started</button>'+
      '</div></div>');
    return out.join('');
  }

  if(board==='loading'||board===null){
    out.push('<p class="lede"><span class="spin"></span> Watching the chain for 20 seconds…</p>');
    out.push('</div>'); return out.join('');
  }
  if(board.error){ out.push(msg('err',esc(board.error))+'</div>'); return out.join(''); }

  out.push('<p class="lede" id="liveNote">'+esc(board.note)+'</p>');

  var cur=String(minMints());
  var opts=[['2','Everything'],['10','Busier'],['40','Busiest']];
  var seg='';
  for(var t=0;t<opts.length;t++)
    seg+='<button class="'+(cur===opts[t][0]?'on':'')+'" onclick="setMinMints(\''+opts[t][0]+
      '\')">'+esc(opts[t][1])+'</button>';
  out.push('<div class="acts"><div class="seg">'+seg+'</div>'+
    '<span class="mute" id="liveSeen" style="font-size:12px">'+
      esc(board.observed.mintsSeen)+' mints seen</span>'+
    '</div>');
  out.push('</div>');

  // Newest first, so the top of the list is always where to look.
  out.push('<div class="card flat" id="liveWrap">'+
    '<div class="k">Newest first</div>'+
    '<div id="liveList" style="margin-top:10px"></div>'+
    '<div id="liveMore"></div></div>');

  out.push('<details class="card flat" id="liveHist"><summary>Earlier this session</summary>'+
    '<div id="histList" style="margin-top:14px"></div></details>');
  return out.join('');
}

/**
 * Update the list without rebuilding it.
 *
 * Replacing the container's innerHTML on every refresh destroyed and recreated
 * every <img>, which is why the artwork kept blinking out. Rows are keyed by
 * contract: existing ones are updated in place and their images are never
 * touched.
 */
function paintLive(){
  var list=$('liveList');
  if(!list||!board||board==='loading'||board.error) return;

  var all=(board.mints)||[];
  if(!all.length){
    list.innerHTML='<p class="lede">'+esc(emptyReason())+'</p>';
    if($('liveMore')) $('liveMore').innerHTML='';
    paintHistory();
    return;
  }
  var stale=list.querySelector('p.lede');
  if(stale) stale.remove();

  // Ten at a time. More than that on screen at once and the top of the list
  // stops being the thing you look at.
  var mints=all.slice(0, LIVE_PAGE*livePage);

  var seen={};
  for(var i=0;i<mints.length;i++){
    var m=mints[i], id='m_'+m.contract.toLowerCase();
    seen[id]=true;
    var el=document.getElementById(id);
    var isNew=!el;
    if(isNew){
      el=liveCardShell(m);
      el.id=id;
      list.appendChild(el);
    }
    paintCard(el,m);
    // Arriving at the top is the whole signal; say so once.
    if(isNew && i===0) el.classList.add('fresh');
    if(list.children[i]!==el) list.insertBefore(el,list.children[i]||null);
  }

  for(var j=list.children.length-1;j>=0;j--){
    var child=list.children[j];
    if(child.id && !seen[child.id]) list.removeChild(child);
  }

  var more=$('liveMore');
  if(more){
    var left=all.length-mints.length;
    more.innerHTML = left>0
      ? '<div class="acts"><button onclick="showMore()">Show '+
        Math.min(LIVE_PAGE,left)+' more</button>'+
        '<span class="mute" style="font-size:12px">'+esc(mints.length)+' of '+
        esc(all.length)+'</span></div>'
      : '';
  }
  paintHistory();
}

/** Collections seen earlier that are no longer minting. */
function paintHistory(){
  var el=$('histList'), wrap=$('liveHist');
  if(!el||!wrap) return;

  var live={}, rows=[];
  var current=(board&&board.mints)||[];
  for(var i=0;i<current.length;i++) live[current[i].contract]=true;

  var keys=Object.keys(liveHistory);
  for(var k=0;k<keys.length;k++){
    if(live[keys[k]]) continue;
    rows.push(liveHistory[keys[k]]);
  }
  rows.sort(function(a,b){ return b.at-a.at; });

  wrap.style.display = rows.length? '' : 'none';
  wrap.querySelector('summary').textContent =
    'Earlier this session (' + rows.length + ')';

  var out=[];
  for(var r=0;r<rows.length && r<40;r++){
    var m=rows[r].row;
    out.push('<div class="mintcard out" onclick="openLive(\''+esc(addrOnly(m.contract))+'\')">'+
      '<div class="thumb ph">◆</div>'+
      '<div class="grow"><div class="name">'+esc(m.name||shortAddr(m.contract))+'</div>'+
      '<div class="strip">'+metricStrip(m)+'</div></div>'+
      '<div class="pct">'+num(m.progressPct===undefined||m.progressPct===null? '—'
        : Math.round(m.progressPct),'m')+'</div></div>');
  }
  el.innerHTML=out.join('');
}

/** Why the list is empty, in the server's own accounting. */
function emptyReason(){
  var x=(board&&board.excluded)||null;
  if(!x||!x.seen) return 'Nothing is being minted on the chain at the moment. '+
    'Leave this open — it watches again every 20 seconds.';
  var bits=[];
  if(x.belowFloor) bits.push(esc(x.belowFloor)+' had fewer mints than the floor');
  if(x.notNft) bits.push(esc(x.notNft)+' turned out not to be NFT contracts');
  if(x.unreadable) bits.push(esc(x.unreadable)+' could not be identified');
  if(x.notInspected) bits.push(esc(x.notInspected)+' were past the read budget');
  return 'Saw '+esc(x.seen)+' contract(s) being called, but none were verified '+
    'collections'+(bits.length? ': '+bits.join(', ') : '')+'.';
}

/**
 * One row, split into a part that persists and parts that get rewritten.
 *
 * The artwork lives outside everything that changes. A row's numbers move on
 * every refresh, so rewriting the whole row would destroy and recreate its
 * <img> twenty seconds apart — which is exactly what made the thumbnails blink
 * out. The image element is created once and then left alone for as long as the
 * collection is on the board.
 */
function liveCardShell(m){
  var card=document.createElement('div');
  card.className='mintcard';
  var addr=addrOnly(m.contract);
  if(addr) card.onclick=function(e){
    // The action button has its own job; everything else opens the detail.
    if(e.target.closest('button')) return;
    openLive(addr);
  };

  var img=safeUrl(m.imageUrl), art;
  if(img){
    art=document.createElement('img');
    art.className='thumb'; art.alt=''; art.decoding='async'; art.src=img;
    art.onerror=function(){ this.replaceWith(placeholderArt()); };
  } else {
    art=placeholderArt();
  }
  art.setAttribute('data-art','');
  card.appendChild(art);

  var mid=document.createElement('div');
  mid.className='grow';
  mid.setAttribute('data-mid','');
  card.appendChild(mid);

  var pct=document.createElement('div');
  pct.className='pct';
  pct.setAttribute('data-pct','');
  card.appendChild(pct);

  var go=document.createElement('div');
  go.setAttribute('data-go','');
  go.style.flex='none';
  card.appendChild(go);
  return card;
}

function placeholderArt(){
  var el=document.createElement('div');
  el.className='thumb ph';
  el.textContent='◆';
  return el;
}

/** Rewrite only the parts of a row that can change between refreshes. */
function paintCard(card,m){
  card.className='mintcard'+(m.soldOut?' out':'')+
    (card.classList.contains('fresh')?' fresh':'');

  var art=card.querySelector('[data-art]'), img=safeUrl(m.imageUrl);
  if(img && (art.tagName!=='IMG' || art.getAttribute('src')!==img)){
    var next=document.createElement('img');
    next.className='thumb'; next.alt=''; next.decoding='async'; next.src=img;
    next.setAttribute('data-art','');
    next.onerror=function(){ this.replaceWith(placeholderArt()); };
    art.replaceWith(next);
  }

  setHtml(card.querySelector('[data-mid]'),
    '<div class="name">'+esc(m.name||shortAddr(m.contract))+'</div>'+
    '<div class="strip">'+metricStrip(m)+'</div>');
  setHtml(card.querySelector('[data-pct]'), pctBlock(m));
  setHtml(card.querySelector('[data-go]'), goButton(m));
}

/** Write only when the markup differs; an identical write restarts animations. */
function setHtml(el,html){
  if(el && el.getAttribute('data-h')!==html){ el.innerHTML=html; el.setAttribute('data-h',html); }
}

/**
 * The metric strip: every number with its verdict.
 *
 * Green and red are decided on the server, next to the thresholds the hunter
 * uses, so a row that reads green here is one the automatic side would look at
 * twice. The page only paints them.
 */
function metricStrip(m){
  var out=[], ms=m.metrics||[];
  for(var i=0;i<ms.length;i++){
    // The short form folds the label into the value, so every metric fits
    // rather than the last few falling off the end of the line.
    out.push('<b class="'+esc(ms[i].tone)+'" title="'+esc(ms[i].value)+'">'+
      esc(ms[i].short||ms[i].value)+'</b>');
  }
  return out.join('');
}

function pctBlock(m){
  var pct = m.progressPct!==undefined && m.progressPct!==null
    ? Math.max(0,Math.min(100,m.progressPct)) : null;
  if(pct===null) return '<div class="num m mute">—</div>';
  var moving = !m.soldOut && m.status==='live';
  return num(Math.round(pct),'m')+
    '<div class="minibar'+(m.soldOut?' done':(moving?' moving':''))+'">'+
    '<div style="width:'+pct.toFixed(1)+'%"></div></div>';
}

function goButton(m){
  var addr=addrOnly(m.contract), state=minting[m.contract];

  // The outcome replaces the button. A dense row has no space for a paragraph,
  // so the detail rides along in the tooltip and the full text goes to the log.
  if(state && state!=='busy')
    return '<button class="go" title="'+esc(state.text)+'" '+
      'onclick="mintNow(\''+esc(addr)+'\')">'+
      (state.ok? '<span class="good">✓ done</span>' : '<span class="bad">failed</span>')+
      '</button>';

  if(m.soldOut) return '<button class="go" disabled>out</button>';
  if(!addr) return '';
  if(state==='busy') return '<button class="go" disabled><span class="spin"></span></button>';
  if(m.phase==='allowlist')
    return '<button class="go" onclick="mintNow(\''+esc(addr)+'\')" title="Allowlist round '+
      '— only listed wallets can mint">try</button>';
  return '<button class="go solid" onclick="mintNow(\''+esc(addr)+'\')">'+
    (isPractice()?'test':'mint')+'</button>';
}

/** Reuse the detail screen by shaping a board row like a stored finding. */
function openLive(contract){
  var m=null, pool=((board&&board.mints)||[]);
  for(var i=0;i<pool.length;i++) if(pool[i].contract===contract) m=pool[i];
  if(!m && liveHistory[contract]) m=liveHistory[contract].row;
  if(!m) return;

  selected={
    contract:m.contract, name:m.name, imageUrl:m.imageUrl,
    score:undefined, passed:false,
    mintsPerMinute:m.mintsPerMinute, uniqueMinters:m.uniqueMinters,
    remaining:m.remaining, progressPct:m.progressPct,
    projectedSelloutSec:m.projectedSelloutSec,
    firstSeenAt:new Date(Date.now()-m.ageSec*1000).toISOString(),
    lastSeenAt:new Date().toISOString(), timesSeen:1,
    reason:(m.events||[]).map(function(e){ return e.text; }).join(' · '),
    failedChecks:[], live:m,
  };
  // Stop watching while looking at one row: the board holds the sequencer
  // feed open for twenty seconds a round and nothing here needs it.
  stopBoard();
  view='detail'; render(); window.scrollTo({top:0,behavior:'smooth'});
}

async function mintNow(contract){
  if(!addrOnly(contract)) return;
  if(!isPractice() && !confirm('Mint this now?\n\nIt spends real gas from every funded '+
    'wallet on your account.')) return;

  minting[contract]='busy';
  if(view==='live' && $('liveList')) paintLive(); else render();
  try{
    var r=await api('/api/mintnow',{method:'POST',
      body:JSON.stringify({contract:contract,dryRun:isPractice()})});
    if(r.confirmed>0){
      minting[contract]={ok:true,text:'Minted '+r.confirmed+' of '+r.attempted+
        (r.how? ' — '+r.how : '')};
      log('MINTED '+(r.name||shortAddr(contract))+' — '+r.confirmed+' confirmed');
    } else if(r.error){
      minting[contract]={ok:false,text:r.error};
      log('NOT MINTED — '+r.error);
    } else {
      minting[contract]={ok:false,text:'Sent '+r.attempted+', none confirmed yet.'};
    }
  }catch(e){
    minting[contract]={ok:false,text:e.message};
    log('Mint failed — '+e.message);
  }
  if(view==='live' && $('liveList')) paintLive(); else render();
  loadFindings();
}

/* ── screen: origin ─────────────────────────────────────────────────────── */
function renderOrigin(){
  var out=['<div class="card">'];
  out.push('<div class="top"><div><div class="k">Route</div>'+
    '<h1 style="margin-top:4px">How fast is your RPC</h1></div>'+
    '<button class="circ" onclick="go(\'account\')" title="Back">×</button></div>');
  out.push('<div class="acts"><button onclick="loadOrigin()">Measure again</button></div>');

  if(!signedIn()){
    out.push('<p class="lede">Sign in to measure your endpoints.</p></div>');
    return out.join('');
  }
  if(origin==='loading'){ out.push('<p class="lede">Measuring…</p></div>'); return out.join(''); }
  if(!origin){ out.push('<p class="lede">—</p></div>'); return out.join(''); }
  if(origin.error){ out.push(msg('err',esc(origin.error))+'</div>'); return out.join(''); }

  out.push('<p class="lede">'+esc(origin.summary)+'</p>');

  /* Concentric rings by latency — abstract on purpose. Nothing in a signed
     transaction says where anyone is, so a literal map would be invented. */
  var eps=origin.endpoints||[];
  var worst=1;
  for(var w=0;w<eps.length;w++) if(eps[w].rttMs) worst=Math.max(worst,eps[w].rttMs);

  out.push('<div class="reach">');
  out.push('<i style="width:60px;height:60px"></i>');
  out.push('<i style="width:118px;height:118px"></i>');
  out.push('<i style="width:176px;height:176px"></i>');
  out.push('<div class="dot"></div>');
  out.push('<div class="pin" style="top:50%;left:50%;transform:translate(12px,-6px)">sequencer</div>');
  for(var i=0;i<eps.length && i<5;i++){
    var e=eps[i];
    if(!e.rttMs) continue;
    var r=28+Math.min(1,e.rttMs/worst)*60;
    var ang=(i/Math.max(1,Math.min(eps.length,5)))*Math.PI*2 - Math.PI/2;
    var x=Math.cos(ang)*r, y=Math.sin(ang)*r;
    out.push('<div class="dot" style="background:var(--mute);transform:translate('+
      x.toFixed(0)+'px,'+y.toFixed(0)+'px)"></div>');
  }
  out.push('</div>');
  out.push('</div>');

  /* The chosen endpoint, in the reference's inverted card. */
  var best=origin.submitsThrough;
  if(best){
    out.push('<div class="card flat">');
    out.push('<div class="row sel static" style="margin:0">'+
      '<div class="grow"><div class="k">'+esc(best.provider)+
        (best.region? ' · '+esc(best.region):'')+'</div>'+
      '<div class="name">'+esc(best.host)+'</div></div>'+
      '<div class="right">'+num(best.rttMs===undefined?'—':best.rttMs,'l')+
      '<span class="glyph">ms</span></div></div>');
    out.push('</div>');
  }

  out.push('<div class="card flat"><div class="k">Every endpoint</div><div style="margin-top:12px">');
  for(var j=0;j<eps.length;j++){
    var ep=eps[j];
    out.push('<div class="row static"><div class="grow">'+
      '<div class="k">'+esc(ep.role)+' · '+esc(ep.provider)+
        (ep.region? ' · '+esc(ep.region):'')+'</div>'+
      '<div class="name">'+esc(ep.host)+'</div></div>'+
      '<div class="right">'+num(ep.rttMs===undefined?'—':ep.rttMs,'m')+
      '<span class="glyph mute" style="font-size:11px">ms</span></div></div>');
  }
  if(origin.sequencer)
    out.push('<div class="row static"><div class="grow">'+
      '<div class="k">sequencer</div><div class="name">'+esc(origin.sequencer.host)+'</div></div>'+
      '<div class="right">'+num(origin.sequencer.rttMs===undefined?'—':origin.sequencer.rttMs,'m')+
      '<span class="glyph mute" style="font-size:11px">ms</span></div></div>');
  out.push('</div>');

  if(best&&best.rttMs!==undefined)
    out.push('<div class="scale"><span>0ms</span><span>fast</span><span class="on">'+
      esc(best.rttMs)+'ms</span><span>slow</span><span>'+esc(worst)+'ms</span></div>');
  out.push('<div class="hint">'+esc(origin.note)+'</div>');
  out.push('</div>');
  return out.join('');
}

/* ── screen: account ────────────────────────────────────────────────────── */
function renderAccount(){
  var m=mode();
  if(m==='operator') return renderOperator();
  if(m==='account')  return renderUserAccount();

  var out=['<div class="card">'];
  out.push('<div class="top"><div class="thumbs"></div></div>');
  out.push('<h1>Your wallets</h1>');
  out.push('<p class="lede">One tap generates ten wallets. The bot mints from all of them '+
    'at once, so a one-per-wallet drop gets you ten.</p>');
  out.push('<div class="acts"><button class="solid wide" onclick="signUp()"'+
    (busyLabel?' disabled':'')+'>'+
    (busyLabel? '<span class="spin"></span> '+esc(busyLabel) : 'Create 10 wallets')+
    '</button></div>');
  out.push('<div class="hint"><b>Read this first.</b> The server holds these keys so it '+
    'can mint while you are away — that means whoever runs the server can spend them. '+
    'Fund them with gas money and nothing more, and treat them as burners.</div>');
  if(signupNotice&&signupNotice.error) out.push(msg('err',esc(signupNotice.error)));
  out.push(setupWarning());
  out.push('</div>');

  out.push('<details class="card flat"><summary>I have an account key</summary>');
  out.push('<div style="margin-top:14px"><label for="inId">Account id</label>'+
    '<input id="inId" spellcheck="false" placeholder="e.g. k7m2qphx4t"></div>');
  out.push('<div style="margin-top:12px"><label for="inTok">Account key</label>'+
    '<input id="inTok" type="password" autocomplete="off" placeholder="paste key"></div>');
  out.push('<div class="acts"><button class="solid" onclick="signIn()">Sign in</button></div>');
  out.push('</details>');

  out.push('<details class="card flat"><summary>Run this as the operator instead</summary>'+
    '<p class="hint">Mints from the deployment\'s own PRIVATE_KEYS rather than generated '+
    'wallets, over the RPC_URLS you configured. Paste the API_TOKEN from your environment '+
    'variables.</p>'+
    '<div style="margin-top:12px"><label for="opTok">API token</label>'+
    '<input id="opTok" type="password" autocomplete="off" placeholder="paste token"></div>'+
    '<div class="acts"><button class="solid" onclick="saveOpToken()">Sign in</button></div>'+
    '</details>');
  return out.join('');
}

/* The operator runs on configured keys, so there is nothing to generate or
   reveal — only what the deployment already has. */
function renderOperator(){
  var s=statusInfo||{}, out=['<div class="card">'];
  out.push('<div class="top"><div><div class="k">Signed in as</div>'+
    '<h1 style="margin-top:4px">Operator</h1></div>'+
    '<button class="circ" onclick="signOutOperator()" title="Sign out">⏻</button></div>');

  // The common case is not a bad token: it is an operator sign-in on a
  // deployment set up for accounts, which has no PRIVATE_KEYS at all. Saying
  // "your token is wrong" there would send someone hunting the wrong problem.
  var noKeys = health && health.configured && health.configured.privateKeys===false;
  if(s.error && noKeys){
    out.push(msg('warn','<b>No operator wallets on this deployment.</b><br>'+
      'PRIVATE_KEYS is not set, so there is nothing for the operator to mint from.'));
    out.push('<div class="hint">Either set PRIVATE_KEYS in your environment and redeploy, '+
      'or sign out and create an account — that generates ten wallets for you and needs no '+
      'environment variable beyond ACCOUNT_ENCRYPTION_KEY.</div>');
    out.push('<div class="acts"><button class="solid" onclick="signOutOperator()">'+
      'Use a generated account</button></div>');
    out.push('</div>'); return out.join('');
  }
  if(s.error){ out.push(msg('err',esc(s.error)));
    out.push('<div class="hint">If that says the token is invalid, clear it and paste '+
      'the API_TOKEN from your environment variables again.</div>');
    out.push('<div class="acts"><button onclick="signOutOperator()">Clear token</button></div>');
    out.push('</div>'); return out.join(''); }

  if(!s.wallets){ out.push('<p class="lede">Loading…</p></div>'); return out.join(''); }

  var total=0, funded=0;
  for(var i=0;i<s.wallets.length;i++){
    var b=Number(s.wallets[i].balanceEth);
    if(isFinite(b)){ total+=b; if(b>0) funded++; }
  }
  out.push('<div style="display:flex;align-items:baseline;gap:12px;margin:8px 0 4px">'+
    num(total.toFixed(4),'xl')+'<div class="num m mute">ETH</div></div>');
  out.push('<div class="k">'+esc(funded)+' of '+esc(s.wallets.length)+
    ' configured wallets funded</div>');
  out.push('<div class="hint">These come from PRIVATE_KEYS in your environment. To mint '+
    'from generated wallets instead, sign out and create an account.</div>');
  out.push('</div>');

  out.push('<div class="card flat"><div class="k">Deployment</div><div style="margin-top:12px">');
  out.push(plainRow('network', esc(s.network)+' · chain '+esc(s.chainId)));
  out.push(plainRow('block', esc(s.blockNumber||'—')));
  out.push(plainRow('spend cap', esc(s.spendCeilingEth)+' ETH'));
  for(var e=0;e<((s.rpcEndpoints)||[]).length;e++)
    out.push(plainRow('rpc', esc(s.rpcEndpoints[e].url),
      s.rpcEndpoints[e].medianRttMs!==undefined? esc(s.rpcEndpoints[e].medianRttMs)+' ms':''));
  out.push('</div>');
  out.push('<div class="hint">Operator endpoints come from RPC_URLS and are changed by '+
    'redeploying, not from this screen. Accounts can point themselves somewhere else.</div>');
  out.push('<div class="acts"><button class="link" onclick="go(\'origin\')">'+
    'see how fast they are</button></div>');
  out.push('</div>');

  if(s.observedChainId && s.observedChainId!==s.chainId)
    out.push('<div class="card flat">'+msg('err','Wrong network — the RPC reports chain '+
      esc(s.observedChainId)+', but NETWORK says '+esc(s.chainId)+'.')+'</div>');
  return out.join('');
}

function plainRow(k,v,right){
  return '<div class="row static"><div class="grow"><div class="k">'+esc(k)+'</div>'+
    '<div class="name">'+v+'</div></div>'+
    (right? '<div class="right"><div class="num m">'+right+'</div></div>':'')+'</div>';
}

/**
 * What auto-mint costs, and how to pay for it.
 *
 * The whole charge is on one card: the price, the address, the fee on each
 * mint, and the sentence saying the fee is this app's rather than the chain's.
 * Nothing about it is folded into a total somewhere else — these are wallets
 * this app generated and holds the keys to, so the only way the person paying
 * knows what they are paying is because this screen says so.
 */
function renderBilling(){
  if(!billing) return '';
  if(billing.error) return '<div class="card flat"><div class="k">Auto-mint</div>'+
    msg('err',esc(billing.error))+'</div>';
  if(!billing.billingEnabled) return '';

  var st=billing.status||{}, out=[];
  out.push('<div class="card">');
  out.push('<div class="k">Auto-mint subscription</div>');

  if(st.active){
    out.push('<div style="display:flex;align-items:baseline;gap:10px;margin:10px 0 2px">'+
      num(st.daysLeft===undefined?'—':st.daysLeft,'xl')+
      '<div class="num m mute">day'+(st.daysLeft===1?'':'s')+' left</div></div>');
    out.push('<p class="lede">'+ic('check')+' Paid'+
      (st.until? ' through '+esc(String(st.until).slice(0,10)) : '')+
      '. Pay again any time — days are added, not replaced.</p>');
  }else{
    out.push('<div style="display:flex;align-items:baseline;gap:10px;margin:10px 0 2px">'+
      num(billing.priceEth,'xl')+'<div class="num m mute">ETH</div></div>');
    out.push('<div class="k">for '+esc(billing.days)+' days of auto-mint</div>');
    out.push('<p class="lede">'+esc(billing.priceNote)+'</p>');
  }

  out.push('<div class="hint">Free, with or without this: scanning, the live board, '+
    'and your findings history. This pays for the bot watching and minting for you.</div>');

  // Paying: address, amount, then the hash. Three steps, numbered, because
  // this is the one flow where a half-finished attempt costs real money.
  out.push('<details class="card flat" style="margin:14px 0 0"'+(st.active?'':' open')+'>');
  out.push('<summary>'+(st.active? 'Extend it' : 'Pay from one of your wallets')+'</summary>');
  out.push('<div style="margin-top:14px">');
  out.push('<div class="row static"><div class="grow"><div class="k">1 — send exactly</div>'+
    '<div class="name mono">'+esc(billing.priceEth)+' ETH</div></div></div>');
  out.push('<div class="row static"><div class="grow"><div class="k">2 — to this address</div>'+
    '<div class="name mono full">'+esc(billing.payTo)+'</div></div>'+
    '<div class="right"><button class="icon-only" onclick="copyPayTo()" '+
      'title="Copy address" aria-label="Copy address">'+ic('copy')+'</button></div></div>');
  out.push('<div class="hint">Send it from one of the ten wallets above — the payment is '+
    'matched to your account by the wallet it came from, so one sent from anywhere else '+
    'cannot be credited to you.</div>');
  out.push('<div style="margin-top:14px"><label for="payHash">3 — paste the transaction hash</label>'+
    '<input id="payHash" class="mono" spellcheck="false" placeholder="0x…"></div>');
  out.push('<div class="acts"><button class="solid glow" onclick="claimPayment()"'+
    (busyLabel?' disabled':'')+'>'+ic('spark')+'Unlock auto-mint</button>'+
    '<span class="mute" style="font-size:12px">Checked on-chain — nothing is taken on trust.</span>'+
    '</div>');
  if(subMsg) out.push(msg(subMsg.kind,esc(subMsg.text)));
  out.push('</div></details>');

  // The per-mint fee, in its own words. Never merged into a gas figure: it is
  // a charge by this app, and calling it anything else would be a lie about
  // who is charging you.
  out.push('<div class="card flat" style="margin:12px 0 0">');
  out.push('<div class="k">Service fee on each mint</div>');
  out.push('<div style="display:flex;align-items:baseline;gap:10px;margin:8px 0 2px">'+
    num(billing.feePct+'%','l')+'<div class="mute" style="font-size:13px">of that mint\'s own gas</div></div>');
  out.push('<div class="hint">Charged only when a mint actually lands, capped at '+
    esc(billing.feeMaxEth)+' ETH, and sent as its own transaction to '+
    '<span class="mono">'+esc(shortAddr(billing.payTo))+'</span> so you can check it on the '+
    'explorer. <b>This is a charge by this app, not a network cost.</b></div>');
  out.push('</div>');

  out.push('</div>');
  return out.join('');
}

async function copyPayTo(){
  try{ await navigator.clipboard.writeText(billing.payTo); subMsg={kind:'ok',text:'Address copied.'}; }
  catch(e){ subMsg={kind:'warn',text:'Could not copy — select the address and copy it by hand.'}; }
  render();
}

async function claimPayment(){
  var el=$('payHash'), hash=el? el.value.trim() : '';
  if(!hash){ subMsg={kind:'warn',text:'Paste the transaction hash of the payment you sent.'}; render(); return; }
  subMsg=null; busyLabel='Checking the chain'; render();
  try{
    billing=await api('/api/subscribe',{method:'POST',body:JSON.stringify({txHash:hash})});
    subMsg={kind:(billing.status&&billing.status.active)?'ok':'warn',
      text:billing.note||(billing.status&&billing.status.message)||''};
  }catch(e){
    subMsg={kind:'err',text:e.message};
  }finally{
    busyLabel=''; render();
  }
}

function renderUserAccount(){
  var a=acct(), out=[];
  out.push('<div class="card">');
  out.push('<div class="top"><div><div class="k">Account</div>'+
    '<h1 style="margin-top:4px" class="mono">'+esc(a.id)+'</h1></div>'+
    '<button class="circ" onclick="signOut()" title="Sign out">⏻</button></div>');

  if(signupNotice&&signupNotice.token){
    out.push(msg('warn','<b>Save your account key now.</b> It is shown once and cannot be '+
      'recovered.<br><span class="mono" style="word-break:break-all">'+
      esc(signupNotice.token)+'</span><br>'+esc(signupNotice.notice||'')));
  }
  if(acctView&&acctView.error) out.push(msg('err',esc(acctView.error)));

  if(acctView&&acctView.wallets){
    var funded=0, total=0;
    for(var i=0;i<acctView.wallets.length;i++){
      var b=Number(acctView.wallets[i].balanceEth);
      if(isFinite(b)){ total+=b; if(b>0) funded++; }
    }
    out.push('<div style="display:flex;align-items:baseline;gap:12px;margin:8px 0 4px">'+
      num(total.toFixed(4),'xl')+'<div class="num m mute">ETH</div></div>');
    out.push('<div class="k">'+esc(funded)+' of '+esc(acctView.wallets.length)+' wallets funded</div>');
    if(!funded) out.push('<div class="hint">Nothing can be minted until at least one wallet '+
      'holds ETH on this chain. Send gas money to the addresses below.</div>');
  }

  var subbed = !billing || !billing.billingEnabled || (billing.status&&billing.status.active);
  var on = acctView && acctView.autoMint;
  out.push('<div class="acts">'+
    '<button class="'+(on?'solid':'')+'" onclick="toggleAuto('+(on?'false':'true')+')">'+
      ic(on?'check':'x')+(on? 'Auto-mint on' : 'Auto-mint off')+'</button>'+
    '<button onclick="revealKeys()">'+ic('key')+'Show private keys</button></div>');
  // Said here rather than only on the billing card, because this is the switch
  // people press and then wonder why nothing happened.
  if(on && !subbed) out.push('<div class="hint">'+
    'Switched on, but nothing will be minted until the subscription below is paid.</div>');
  out.push('</div>');

  out.push(renderBilling());

  // Ten addresses is a wall, and it is not what you came to this screen for.
  // Collapsed by default, with the one number that matters in the summary.
  var ws=(acctView&&acctView.wallets)||[];
  if(!ws.length && acctView && acctView.addresses)
    for(var q=0;q<acctView.addresses.length;q++) ws.push({address:acctView.addresses[q],balanceEth:'—'});

  out.push('<details id="walletList" class="card flat"><summary>Wallet addresses ('+esc(ws.length)+
    ') — tap to show</summary>');
  out.push('<div style="margin-top:14px">');
  for(var j=0;j<ws.length;j++){
    out.push('<div class="row static"><div class="grow">'+
      '<div class="k">'+esc(j+1)+'</div>'+
      '<div class="name mono">'+esc(shortAddr(ws[j].address))+'</div></div>'+
      '<div class="right">'+num(ws[j].balanceEth,'m')+
      '<span class="glyph mute" style="font-size:11px">ETH</span></div></div>');
  }
  out.push('</div>');
  out.push('<div class="acts"><button onclick="copyAddresses()">Copy all addresses</button>'+
    '<span id="copyState" class="mute" style="font-size:12px"></span></div>');
  out.push('<div class="hint">Send a small amount of ETH to each. Ten funded wallets means '+
    'ten mints where one wallet would get one.</div>');
  out.push('</details>');

  if(revealed){
    out.push('<div class="card flat"><div class="k">Private keys</div>');
    if(revealed.error) out.push(msg('err',esc(revealed.error)));
    else{
      out.push(msg('warn',esc(revealed.warning||'')));
      for(var k=0;k<(revealed.keys||[]).length;k++)
        out.push('<div class="keyrow"><div class="grow">'+esc(revealed.keys[k].privateKey)+
          '</div></div>');
      out.push('<div class="acts"><button onclick="hideKeys()">Hide</button></div>');
    }
